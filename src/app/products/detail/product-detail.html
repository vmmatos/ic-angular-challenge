<section class="detail">
  @if (pending()) {
    <p class="sr-only" role="status">Loading product…</p>
    <div class="detail__layout" aria-hidden="true">
      <div class="skeleton detail__image"></div>
      <div class="detail__content">
        <div class="skeleton" style="width: 30%; height: 0.875rem; margin-bottom: 0.5rem"></div>
        <div class="skeleton" style="width: 70%; height: 1.75rem; margin-bottom: 0.75rem"></div>
        <div class="skeleton" style="width: 40%; height: 1.25rem; margin-bottom: 0.75rem"></div>
        <div class="skeleton" style="width: 20%; height: 1.25rem; margin-bottom: 0.75rem"></div>
        <div class="skeleton" style="height: 4rem"></div>
      </div>
    </div>
  } @else if (notFound()) {
    <app-error-page
      heading="Product not found"
      message="We couldn't find the product you're looking for."
    />
  } @else if (product(); as product) {
    <a class="detail__back" routerLink="/products">&larr; Back to products</a>
    <div class="detail__layout">
      <img class="detail__image" [src]="product.image" [alt]="product.title" />
      <div class="detail__content">
        <p class="detail__category">{{ product.category }}</p>
        <h2>{{ product.title }}</h2>
        <app-product-rating
          class="detail__rating"
          [rate]="product.rating.rate"
          [count]="product.rating.count"
        />
        <p class="detail__price">{{ product.price | currency }}</p>
        <p class="detail__description">{{ product.description }}</p>
      </div>
    </div>
  }
</section>
